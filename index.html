<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Performance Update - Sunboost Solar</title>
<style>
  *{box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif}
  body{margin:0;background:#f4f6f8;color:#1c2733}
  header{background:#0f3d5c;color:#fff;padding:14px 20px}
  header h1{margin:0;font-size:19px}
  header small{color:#ffc857}
  .wrap{display:flex;flex-wrap:wrap;gap:18px;padding:18px;max-width:1150px;margin:auto}
  .card{background:#fff;border-radius:10px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.08);flex:1;min-width:320px}
  h2{font-size:15px;margin:0 0 14px;color:#0f3d5c;text-transform:uppercase;letter-spacing:.5px}
  label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
  input,textarea{width:100%;padding:9px;border:1px solid #cbd5e0;border-radius:6px;font-size:14px}
  input:focus,textarea:focus{outline:none;border-color:#f59e0b}
  textarea{resize:vertical;min-height:52px}
  pre{background:#0f172a;color:#e6edf3;padding:14px;border-radius:8px;white-space:pre-wrap;
      font-family:Consolas,monospace;font-size:13.5px;line-height:1.65;min-height:330px;margin:0}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  button{border:0;padding:10px 15px;border-radius:6px;font-size:13.5px;font-weight:600;cursor:pointer}
  .b1{background:#f59e0b;color:#fff}.b2{background:#0f3d5c;color:#fff}
  .b3{background:#25d366;color:#fff}.b4{background:#e2e8f0;color:#333}
  .b5{background:#dc2626;color:#fff}.b6{background:#8b5cf6;color:#fff}
  button:hover{opacity:.88}
  #msg{margin-top:10px;font-size:13px;font-weight:600;color:#0a7d3c;min-height:18px}
  .hist{margin-top:14px;font-size:13px}
  .hist div{display:flex;justify-content:space-between;align-items:center;
            border-bottom:1px solid #eee;padding:6px 0}
  .hist span{cursor:pointer;color:#0f3d5c;font-weight:600}
  .auto-tag{background:#fef3c7;color:#92400e;padding:2px 6px;border-radius:4px;font-size:11px;margin-left:6px}
  .auto-filled{border:2px solid #f59e0b !important;background:#fffbeb}
  .rating{display:inline-block;padding:3px 8px;border-radius:4px;font-size:12px;font-weight:700;margin-left:6px}
  .r-excellent{background:#d1fae5;color:#065f46}
  .r-good{background:#dbeafe;color:#1e40af}
  .r-average{background:#fef3c7;color:#92400e}
  .r-poor{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<header>
  <h1>Daily Performance Update &nbsp;<small>Sunboost Solar</small></h1>
</header>

<div class="wrap">
  <div class="card">
    <h2>Raw Data Bharein</h2>
    <label>Date <span id="dateDisplay" style="font-weight:400;color:#64748b"></span></label>
    <input type="date" id="date">
    <div id="fields"></div>
    
    <label style="margin-top:16px">How was your Performance? <span class="auto-tag">Auto-generated</span></label>
    <textarea id="perf" placeholder="Auto-filled based on your data..." class="auto-filled"></textarea>
    <button class="b6" onclick="regeneratePerf()" style="margin-top:6px;font-size:12px;padding:6px 12px">🔄 Regenerate Suggestions</button>
    
    <label style="margin-top:12px">Tomorrow, will focus on ______ <span class="auto-tag">Auto-generated</span></label>
    <textarea id="focus" placeholder="Auto-filled based on gaps..." class="auto-filled"></textarea>
    <button class="b6" onclick="regenerateFocus()" style="margin-top:6px;font-size:12px;padding:6px 12px">🔄 Regenerate Suggestions</button>
    
    <div class="btns">
      <button class="b4" onclick="clearAll()">🔄 Clear All / New Day</button>
    </div>
  </div>

  <div class="card">
    <h2>Ready Report (Preview) <span id="ratingBadge"></span></h2>
    <pre id="out"></pre>
    <div class="btns">
      <button class="b1" onclick="copyIt()">📋 Copy Report</button>
      <button class="b3" onclick="waIt()">💬 WhatsApp</button>
      <button class="b2" onclick="dlIt()">⬇ Save .txt</button>
      <button class="b4" onclick="saveHist()">💾 Save to History</button>
      <button class="b5" onclick="clearHistory()">🗑 Clear Old Data</button>
    </div>
    <div id="msg"></div>
    <div class="hist" id="hist"></div>
  </div>
</div>

<script>
/* ====== FIELDS ====== */
const F=[
 ["calls","Calls","e.g. 45"],
 ["emails","Emails","e.g. 20"],
 ["talk","Talk time","e.g. 1 hr 25 min"],
 ["leadsY","Total Leads till Yesterday","e.g. 120"],
 ["leadsT","Total Leads today","e.g. 8"],
 ["salesY","Sales till Yesterday","e.g. 15"],
 ["salesT","Sales today","e.g. 2"],
 ["cost","Costing per Kw","e.g. 45000"],
 ["ref","Ref generated","e.g. 3"],
 ["leaves","Total Leaves","e.g. 0 or 1"],
 ["worked","Worked on ______ today","e.g. follow-ups & PM Surya Ghar enquiries"]
];
const LONG=["worked"];
const box=document.getElementById("fields");
F.forEach(([id,lab,ph])=>{
  const l=document.createElement("label"); l.textContent=lab; box.appendChild(l);
  const el=document.createElement(LONG.includes(id)?"textarea":"input");
  el.id=id; el.placeholder=ph; el.addEventListener("input",autoGenerate); box.appendChild(el);
});

const perfEl=document.getElementById("perf");
const focusEl=document.getElementById("focus");

/* ====== DATE ====== */
const pad=n=>String(n).padStart(2,"0");
const dEl=document.getElementById("date");
const dateDisplay=document.getElementById("dateDisplay");
const today=new Date();
const todayStr=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
dEl.value=todayStr;
dateDisplay.textContent=`(Today: ${todayStr.split("-").reverse().join("-")})`;
dEl.addEventListener("change",()=>{
  const sel=dEl.value;
  dateDisplay.textContent=sel===todayStr?`(Today: ${sel.split("-").reverse().join("-")})`:`(Selected: ${sel.split("-").reverse().join("-")})`;
  autoGenerate();
});

const v=id=>document.getElementById(id).value.trim();
const n=id=>parseFloat(v(id))||0;
const dmy=()=>dEl.value?dEl.value.split("-").reverse().join("-"):"";

/* ====== REAL SALES REASONS DATABASE ====== */
const GOOD_REASONS=[
  "Consistently hit daily call & email targets with quality outreach",
  "Achieved strong lead-to-conversion ratio today",
  "Successfully handled client objections and closed deals",
  "Generated quality referrals from satisfied customers",
  "Booked multiple site visits for this week",
  "Sent all pending quotations on time with proper follow-up",
  "High talk time reflected deep client engagement",
  "Effectively explained PM Surya Ghar Yojana benefits to prospects",
  "Converted cold leads into warm opportunities",
  "Maintained excellent CRM discipline with updated notes",
  "Delivered compelling ROI presentations to decision-makers",
  "Successfully upsold additional capacity to existing clients",
  "Resolved technical queries promptly with coordination team",
  "Built strong rapport with channel partners for referrals",
  "Closed deals despite competitor pricing pressure",
  "Proactively followed up on stale leads and revived them",
  "Achieved daily revenue target ahead of schedule",
  "Received positive client feedback on service quality",
  "Identified and pursued high-value commercial leads",
  "Maintained pipeline health with balanced prospect stages"
];

const AVERAGE_REASONS=[
  "Met basic calling targets but conversion needs improvement",
  "Lead flow was moderate; need to boost prospecting efforts",
  "Some proposals sent but follow-ups are pending",
  "Talk time was decent but quality of conversations can improve",
  "Partial target achievement; consistency required",
  "Handled routine enquiries but missed high-value opportunities",
  "Time management needs tightening for better output",
  "Referral generation was limited this day",
  "Some objections remained unresolved; need better product knowledge",
  "Pipeline exists but movement to closure stage is slow",
  "Average day with room for sharper execution",
  "Completed daily tasks but didn't push beyond comfort zone",
  "Client responses were lukewarm; need better value proposition",
  "Follow-up discipline needs strengthening",
  "Balanced effort across activities but no standout wins"
];

const POOR_REASONS=[
  "Call volume was significantly below daily target",
  "Lead conversion rate dropped sharply today",
  "Multiple follow-ups missed; need better tracking system",
  "Zero closures despite having qualified leads in pipeline",
  "Talk time too low; indicates insufficient client engagement",
  "No referrals generated; need to ask happy customers proactively",
  "Pipeline stagnant with no forward movement",
  "Could not handle pricing objections effectively",
  "Heavy competitor pressure in territory impacted conversions",
  "Proposals delayed; clients went cold",
  "Market resistance high due to seasonal/monsoon factors",
  "Several clients ghosted after initial interest",
  "Technical queries on net metering/subsidy couldn't be answered confidently",
  "Site visits got cancelled last minute by clients",
  "Credit/loan approval delays stalled closures",
  "Low motivation levels affected overall productivity",
  "Product knowledge gaps surfaced during client conversations",
  "Territory coverage was poor; missed key areas",
  "Did not leverage PM Surya Ghar subsidy angle effectively",
  "Lack of urgency in follow-ups cost potential deals"
];

const TOMORROW_FOCUS=[
  "follow up on all quotations sent in last 48 hours",
  "cold calling new residential segment in target area",
  "reconnecting with stale leads older than 30 days",
  "booking site visits for this week's serious prospects",
  "sending pending proposals with ROI breakdown",
  "asking 3 happy customers for referrals",
  "handling price objections with value-based pitch",
  "attending product training on latest inverter technology",
  "updating CRM with all pending notes and next steps",
  "visiting existing clients for referrals and testimonials",
  "researching competitor pricing to strengthen negotiation",
  "working on closing techniques for high-ticket deals",
  "clearing pending documentation for loan-approved cases",
  "coordinating with technical team on pending site surveys",
  "preparing for month-end target push",
  "improving email templates for better response rates",
  "LinkedIn outreach to commercial/industrial prospects",
  "WhatsApp campaign to warm leads with subsidy calculator",
  "handling PM Surya Ghar Yojana documentation queries",
  "explaining net metering process to confused prospects",
  "conducting ROI presentations to decision-makers",
  "following up on site visit feedback",
  "working on cross-sell battery storage to existing solar clients",
  "reviving leads lost to competitor with better offer",
  "building channel partner network for referrals",
  "improving product knowledge on hybrid systems",
  "focusing on commercial rooftop segment",
  "reducing talk-to-close ratio through better qualification"
];

/* ====== SMART ANALYSIS ====== */
function scorePerformance(){
  const calls=n("calls"), emails=n("emails"), leadsT=n("leadsT"), salesT=n("salesT");
  const ref=n("ref"), leaves=n("leaves");
  let score=0;
  
  if(calls>=50) score+=3;
  else if(calls>=35) score+=2;
  else if(calls>=20) score+=1;
  
  if(emails>=25) score+=2;
  else if(emails>=15) score+=1;
  
  if(leadsT>=10) score+=3;
  else if(leadsT>=6) score+=2;
  else if(leadsT>=3) score+=1;
  
  if(salesT>=3) score+=4;
  else if(salesT>=2) score+=3;
  else if(salesT>=1) score+=2;
  else if(leadsT>=3 && salesT===0) score-=1;
  
  if(ref>=4) score+=2;
  else if(ref>=2) score+=1;
  
  if(leaves>0) score-=2;
  
  return score;
}

function pickRandom(arr,count){
  const shuffled=[...arr].sort(()=>0.5-Math.random());
  return shuffled.slice(0,count);
}

function generatePerformanceText(){
  const score=scorePerformance();
  const calls=n("calls"), leadsT=n("leadsT"), salesT=n("salesT");
  
  let rating, ratingClass, reasons;
  
  if(score>=12){
    rating="Excellent"; ratingClass="r-excellent";
    reasons=pickRandom(GOOD_REASONS,2);
  }else if(score>=7){
    rating="Good"; ratingClass="r-good";
    reasons=pickRandom(GOOD_REASONS,1).concat(pickRandom(AVERAGE_REASONS,1));
  }else if(score>=3){
    rating="Average"; ratingClass="r-average";
    reasons=pickRandom(AVERAGE_REASONS,2);
  }else{
    rating="Needs Improvement"; ratingClass="r-poor";
    reasons=pickRandom(POOR_REASONS,2);
  }
  
  let specific="";
  if(salesT>=2 && leadsT>=5) specific=" Strong conversion from today's leads.";
  else if(salesT===0 && leadsT>=5) specific=" Need to improve closing on qualified leads.";
  else if(calls<25) specific=" Calling activity needs significant boost.";
  else if(leadsT<3) specific=" Lead generation is below expectations.";
  
  return {
    text:`${rating}. ${reasons.join(". ")}.${specific}`,
    rating, ratingClass
  };
}

function generateFocusText(){
  const calls=n("calls"), leadsT=n("leadsT"), salesT=n("salesT"), ref=n("ref");
  const leaves=n("leaves");
  let focus=[];
  
  if(calls<35) focus.push("increase daily calling to 40+ with better time blocks");
  if(leadsT<5) focus.push("boost lead generation through cold calling & referrals");
  if(salesT===0 && leadsT>0) focus.push("closing techniques for qualified leads in pipeline");
  if(salesT>=2) focus.push("maintaining momentum & asking for referrals from today's closures");
  if(ref<2) focus.push("proactively asking 3 happy customers for referrals");
  if(leaves>0) focus.push("consistent daily activity to compensate for leave day");
  
  const strategic=pickRandom(TOMORROW_FOCUS,1)[0];
  if(!focus.includes(strategic)) focus.push(strategic);
  
  return focus.slice(0,3).join("; ");
}

/* ====== AUTO-GENERATE FUNCTION ====== */
function autoGenerate(){
  // Only auto-fill if fields are empty or have auto-generated content
  const perfResult=generatePerformanceText();
  const focusText=generateFocusText();
  
  // Always update with fresh suggestions
  perfEl.value=perfResult.text;
  focusEl.value=focusText;
  
  // Update rating badge
  document.getElementById("ratingBadge").innerHTML=
    `<span class="rating ${perfResult.ratingClass}">${perfResult.rating}</span>`;
  
  // Update preview
  updatePreview();
}

function regeneratePerf(){
  const perfResult=generatePerformanceText();
  perfEl.value=perfResult.text;
  updatePreview();
  flash("🔄 New performance suggestions generated!");
}

function regenerateFocus(){
  const focusText=generateFocusText();
  focusEl.value=focusText;
  updatePreview();
  flash("🔄 New focus suggestions generated!");
}

function build(){
  const L=[];
  L.push("Daily Performance Update ("+dmy()+")");
  L.push("Calls: "+v("calls"));
  L.push("Emails: "+v("emails"));
  L.push("Talk time: "+v("talk"));
  L.push("Total Leads till Yesterday: "+v("leadsY"));
  L.push("Total Leads today: "+v("leadsT"));
  L.push("Sales till Yesterday: "+v("salesY"));
  L.push("Sales today: "+v("salesT"));
  L.push("Costing per Kw: "+v("cost"));
  L.push("Ref generated: "+v("ref"));
  L.push("Total Leaves: "+v("leaves"));
  L.push("Worked on "+(v("worked")||"__________")+" today.");
  L.push("How was your Performance? "+v("perf"));
  L.push("Tomorrow, will focus on "+v("focus"));
  return L.join("\n");
}

function updatePreview(){
  document.getElementById("out").textContent=build();
  const o={date:dEl.value}; 
  F.forEach(([id])=>o[id]=document.getElementById(id).value);
  o.perf=perfEl.value;
  o.focus=focusEl.value;
  localStorage.setItem("sb_draft",JSON.stringify(o));
}

function flash(t,color){
  const m=document.getElementById("msg");
  m.textContent=t; 
  m.style.color=color||"#0a7d3c";
  setTimeout(()=>m.textContent="",2500);
}

function copyIt(){
  const txt=build();
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(txt).then(()=>flash("✅ Copy ho gaya! Ab WhatsApp/Email mein Ctrl+V karein."));
  }else{
    const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);
    ta.select();document.execCommand("copy");ta.remove();
    flash("✅ Copy ho gaya! Ab Ctrl+V karein.");
  }
}
function waIt(){window.open("https://wa.me/?text="+encodeURIComponent(build()),"_blank");}
function dlIt(){
  const b=new Blob([build()],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download="Performance_Report_"+dmy()+".txt"; a.click();
  flash("✅ Text file download ho gayi.");
}
function clearAll(){
  if(!confirm("Saare fields clear kar dein?"))return;
  F.forEach(([id])=>document.getElementById(id).value="");
  dEl.value=todayStr;
  dateDisplay.textContent=`(Today: ${todayStr.split("-").reverse().join("-")})`;
  autoGenerate();
  flash("🔄 Naya din shuru! Auto-generated suggestions ready.");
}

/* ====== HISTORY ====== */
function getH(){try{return JSON.parse(localStorage.getItem("sb_hist")||"[]")}catch(e){return[]}}
function saveHist(){
  const h=getH(); 
  const existing=h.findIndex(x=>x.d===dmy());
  if(existing>=0) h[existing]={d:dmy(),t:build()};
  else h.unshift({d:dmy(),t:build()});
  localStorage.setItem("sb_hist",JSON.stringify(h.slice(0,30)));
  drawH(); flash("💾 History mein save ho gaya.");
}
function clearHistory(){
  const h=getH();
  if(h.length===0){flash("⚠️ History already empty hai.","#dc2626");return;}
  if(!confirm(`Kya aap sach mein ${h.length} purani reports delete karna chahti hain?\n\nYeh action undo nahi hoga!`))return;
  localStorage.removeItem("sb_hist");
  drawH(); flash("🗑 Saari purani history clear ho gayi.","#dc2626");
}
function drawH(){
  const h=getH(),c=document.getElementById("hist");
  if(h.length===0){c.innerHTML="<div style='color:#94a3b8;padding:8px 0'>Koi purani report nahi hai abhi.</div>";return;}
  c.innerHTML="<b>📚 Purani Reports ("+h.length+"):</b>";
  h.forEach((r,i)=>{
    const d=document.createElement("div");
    const s=document.createElement("span"); s.textContent="📄 "+r.d;
    s.onclick=()=>{
      if(navigator.clipboard){navigator.clipboard.writeText(r.t);flash("✅ Copy: "+r.d);}
    };
    const x=document.createElement("button"); x.className="b4"; x.textContent="✕";
    x.style.padding="4px 10px";
    x.onclick=(e)=>{
      e.stopPropagation();
      if(!confirm(`Delete report of ${r.d}?`))return;
      const h2=getH(); h2.splice(i,1);
      localStorage.setItem("sb_hist",JSON.stringify(h2));
      drawH(); flash("🗑 Deleted: "+r.d,"#dc2626");
    };
    d.append(s,x); c.appendChild(d);
  });
}

/* ====== DRAFT RESTORE ====== */
try{
  const o=JSON.parse(localStorage.getItem("sb_draft")||"null");
  if(o){ 
    if(o.date){dEl.value=o.date; dateDisplay.textContent=`(Selected: ${o.date.split("-").reverse().join("-")})`;}
    F.forEach(([id])=>{if(o[id]!=null)document.getElementById(id).value=o[id];});
    if(o.perf)perfEl.value=o.perf;
    if(o.focus)focusEl.value=o.focus;
  }
}catch(e){}

// Initial auto-generate
autoGenerate();
drawH();
</script>
</body>
</html>
